name: Build Linux Prebuilt

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - scripts/build-linux-prebuilt.sh

permissions:
  contents: write

jobs:
  build-linux-prebuilt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential cmake git \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxss-dev libxxf86vm-dev libwayland-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libegl1-mesa-dev \
            libgles2-mesa-dev libgl1-mesa-dev libxkbcommon-dev

      - name: Build Linux prebuilt dependencies
        run: bash scripts/build-linux-prebuilt.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-linux-x64
          path: prebuilt/linux
          retention-days: 14

      - name: Commit Linux prebuilt to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build: update Linux prebuilt deps [skip ci]"
          file_pattern: "prebuilt/linux/**"
          commit_options: "--no-verify"
