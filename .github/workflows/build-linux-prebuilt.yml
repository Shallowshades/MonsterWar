name: Build Linux Prebuilt

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - scripts/build-linux-prebuilt.sh
      - .github/workflows/build-linux-prebuilt.yml

permissions:
  contents: write

jobs:
  build-linux-prebuilt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential cmake git \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxtst-dev libxss-dev libxxf86vm-dev libwayland-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libegl1-mesa-dev \
            libgles2-mesa-dev libgl1-mesa-dev libxkbcommon-dev

      - name: Build Linux prebuilt dependencies
        continue-on-error: true
        run: |
          mkdir -p prebuilt
          bash scripts/build-linux-prebuilt.sh 2>&1 | tee prebuilt/linux-build.log

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-linux-x64
          path: |
            prebuilt/linux
            prebuilt/linux-build.log
          retention-days: 14

      - name: Commit Linux prebuilt and build log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f prebuilt/linux prebuilt/linux-build.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "build: update Linux prebuilt deps [skip ci]"
            git push origin HEAD:master
          fi
