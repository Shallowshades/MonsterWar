name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_DISABLE_FIND_PACKAGE_SDL3=ON -DCMAKE_DISABLE_FIND_PACKAGE_SDL3_image=ON -DCMAKE_DISABLE_FIND_PACKAGE_SDL3_mixer=ON -DCMAKE_DISABLE_FIND_PACKAGE_SDL3_ttf=ON

      - name: Build
        run: cmake --build build --config Release

  build-asan-ubsan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential cmake \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxss-dev libxxf86vm-dev libwayland-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libegl1-mesa-dev \
            libgles2-mesa-dev libgl1-mesa-dev libxkbcommon-dev

      - name: Configure with ASan+UBSan
        run: cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
              -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build-asan

      - name: Smoke test (dummy SDL)
        run: |
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy timeout 15 ./build-asan/MonsterWar-Linux || test $? -eq 124

  build-tsan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential cmake \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxss-dev libxxf86vm-dev libwayland-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libegl1-mesa-dev \
            libgles2-mesa-dev libgl1-mesa-dev libxkbcommon-dev

      - name: Configure with TSan
        run: cmake -S . -B build-tsan -G Ninja -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
              -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build
        run: cmake --build build-tsan

      - name: Smoke test (dummy SDL)
        run: |
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy timeout 15 ./build-tsan/MonsterWar-Linux || test $? -eq 124

  valgrind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential cmake valgrind \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxss-dev libxxf86vm-dev libwayland-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libegl1-mesa-dev \
            libgles2-mesa-dev libgl1-mesa-dev libxkbcommon-dev

      - name: Configure
        run: cmake -S . -B build-valgrind -G Ninja -DCMAKE_BUILD_TYPE=Debug               -DCMAKE_DISABLE_FIND_PACKAGE_SDL3=ON -DCMAKE_DISABLE_FIND_PACKAGE_SDL3_image=ON               -DCMAKE_DISABLE_FIND_PACKAGE_SDL3_mixer=ON -DCMAKE_DISABLE_FIND_PACKAGE_SDL3_ttf=ON

      - name: Build
        run: cmake --build build-valgrind

      - name: Run under Valgrind (dummy SDL, timeout tolerated)
        run: |
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy timeout 30 \
            valgrind --error-exitcode=1 --leak-check=full \
            ./build-valgrind/MonsterWar-Linux || test $? -eq 124
