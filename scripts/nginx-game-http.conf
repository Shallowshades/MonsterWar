# game.duckboobee.com — HTTP 直出（与现有 www/admin 的 80 端口模式一致，无强制跳转）
# 追加到 /usr/local/nginx/nginx.conf 末尾即可（http{} 块内）。
# SSL 版见 scripts/nginx-game-https.conf（证书到位后追加，路径 /etc/nginx/cert/game.duckboobee.com_bundle.pem + .key）
server {
    listen       80;
    server_name  game.duckboobee.com;

    # wasm 已有 immutable 缓存：浏览器端用 ?v= 查询串强制刷新，配合 max-age 长期缓存 21MB wasm
    location ~* \.(wasm)$ {
        root /usr/local/aurora-vue/game-site;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root   /usr/local/aurora-vue/game-site;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
