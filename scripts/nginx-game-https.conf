# game.duckboobee.com — HTTPS（镜像现有 www/admin 的 443 ssl 写法）
# 追加到 /usr/local/nginx/nginx.conf 末尾即可（http{} 块内）。
# 证书路径与现有站点命名一致；云厂商证书审核通过后，直接覆盖这两个文件再 reload 即可，本块无需改动。
server {
    listen       443 ssl;
    server_name  game.duckboobee.com;

    ssl_certificate     /etc/nginx/cert/game.duckboobee.com_bundle.pem;
    ssl_certificate_key /etc/nginx/cert/game.duckboobee.com.key;
    ssl_session_timeout 5m;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_prefer_server_ciphers on;

    # wasm immutable 缓存：?v= 查询串强制刷新，配合 max-age 长期缓存 21MB wasm
    location ~* \.(wasm)$ {
        root /usr/local/aurora-vue/game-site;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root   /usr/local/aurora-vue/game-site;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
